<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projekt-Cockpit</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--mut:#6e6e73;--line:#e3e3e8;--acc:#0071e3;--soft:#f0f0f4;--red:#ff3b30;--yel:#ffcc00;--grn:#34c759;--org:#ff9500;--sh:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--mut:#98989d;--line:#2c2c2e;--soft:#2a2a2d;--acc:#0a84ff;--sh:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:60px}
h1{font-size:28px;letter-spacing:-.02em;margin:0;font-weight:700}
h2{font-size:20px;letter-spacing:-.01em;margin:0 0 6px}
h3{font-size:16px;margin:0}
.h2{margin:34px 0 12px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 13px;transition:background .15s,filter .15s}
button:hover{background:var(--soft)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:500}
button.pri:hover{filter:brightness(1.08);background:var(--acc)}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--soft)}
button.danger{color:var(--red)}
button.sm,.sm{font-size:12px}
button.sm{padding:3px 8px}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc);padding:0}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(0,113,227,.18)}
input:disabled,select:disabled,textarea:disabled{opacity:1;background:transparent;color:var(--ink);cursor:default}
.mut{color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.c{justify-content:center}
.sp{flex:1}
.wrap{max-width:1320px;margin:0 auto;padding:24px 22px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:18px}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 22px;background:rgba(245,245,247,.8);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
@media (prefers-color-scheme:dark){.top{background:rgba(0,0,0,.72)}}
.brand{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:15px}
.logo{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#0071e3,#5ac8fa);color:#fff;font-size:13px}
.crumb{color:var(--mut)}
.crumbp{display:flex;align-items:center;gap:6px;font-weight:500;max-width:30vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.bigdot{display:inline-block;width:14px;height:14px;border-radius:50%}
.modebadge{font-size:12px;color:var(--grn);white-space:nowrap}
.modebadge.loc{color:var(--mut)}
.help{width:32px;height:32px;border-radius:50%;padding:0;font-weight:700;font-size:15px}
.prevsel{width:auto;max-width:260px;font-size:12px;padding:5px 8px}
.banner{max-width:1320px;margin:12px auto 0;padding:10px 16px;border-radius:12px;background:var(--soft);font-size:13px;display:flex;align-items:center;gap:10px}
.banner.warn{background:#fff4e5;color:#8a5300}
.banner.info{background:#e8f2ff;color:#0a4a91}
@media (prefers-color-scheme:dark){.banner.warn{background:#3a2a10;color:#ffcf8a}.banner.info{background:#0d2440;color:#9ccaff}}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:12px 0 22px}
.hero p{margin:6px 0 0}
.empty{text-align:center;padding:60px 20px;background:var(--card);border-radius:18px;box-shadow:var(--sh)}
.empty .ei{font-size:44px}
.empty h3{margin:8px 0 4px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.pcard{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:18px;cursor:pointer;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px;transition:transform .15s,box-shadow .15s}
.pcard:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.08)}
.pbar{position:absolute;left:0;top:0;right:0;height:4px}
.pc-h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pc-f{display:flex;justify-content:space-between;align-items:center}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0;min-height:40px}
.prog{height:6px;background:var(--soft);border-radius:6px;overflow:hidden}
.prog>div{height:100%;border-radius:6px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--soft);color:var(--mut);white-space:nowrap}
.pill.aktiv{background:#e3f7e9;color:#1a7f37}.pill.pausiert{background:#fff4e5;color:#8a5300}.pill.abgeschlossen{background:#e8f2ff;color:#0a4a91}
.pill.inv{background:#f3e8ff;color:#7a2fb5;align-self:flex-start}
.pill.adm{background:#1d1d1f;color:#fff}
@media (prefers-color-scheme:dark){.pill.aktiv{background:#123d1f;color:#7ee39b}.pill.pausiert{background:#3a2a10;color:#ffcf8a}.pill.abgeschlossen{background:#0d2440;color:#9ccaff}.pill.adm{background:#f5f5f7;color:#000}}
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;font-size:11px;font-weight:600;flex:none;border:2px solid var(--card)}
.av.sm{width:22px;height:22px;font-size:9px}
.avx{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px dashed var(--mut);color:var(--mut);font-size:10px}
.avs{display:flex}.avs .av{margin-left:-7px}.avs .av:first-child{margin-left:0}
.phead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.phead p{margin:6px 0 0}
.right{text-align:right}
.tabs{display:flex;gap:4px;margin:18px 0 20px;background:var(--soft);padding:4px;border-radius:12px;overflow-x:auto;width:max-content;max-width:100%}
.tabs button{border:0;background:transparent;border-radius:9px;padding:7px 14px;white-space:nowrap;color:var(--mut);font-weight:500}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:16px}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.02em}
.kpi .l{font-size:12px;color:var(--mut)}
.ogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.ogrid .card h3{margin-bottom:12px}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li.click{cursor:pointer}.li.click:hover{background:var(--soft);margin:0 -10px;padding:8px 10px;border-radius:8px}
.bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden;flex:1}
.bar>div{height:100%;background:var(--acc);border-radius:8px}
.amp{display:inline-block;width:12px;height:12px;border-radius:50%}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar input,.toolbar select{width:auto}
.toolbar .srch{width:200px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 12px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.teamdrop{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:10px 12px;background:var(--card);border-radius:14px;box-shadow:var(--sh)}
.tdz{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:20px;background:var(--soft);border:2px solid transparent;transition:all .15s}
.tdz.over{border-color:var(--acc);background:rgba(0,113,227,.12);transform:scale(1.06)}
.cnt{font-size:11px;color:var(--mut);background:var(--card);border-radius:10px;padding:0 7px;font-weight:600}
.board{display:flex;gap:14px;overflow-x:auto;align-items:flex-start;padding-bottom:12px}
.col{flex:0 0 285px;background:var(--soft);border-radius:16px;padding:10px;max-height:calc(100vh - 230px);display:flex;flex-direction:column}
.colh{display:flex;align-items:center;gap:7px;padding:4px 4px 10px}
.col-list{min-height:80px;display:flex;flex-direction:column;gap:8px;border-radius:12px;padding:2px;overflow-y:auto;flex:1;transition:background .15s}
.col-list.over{background:rgba(0,113,227,.08)}
.qa{margin-bottom:8px}
.task{background:var(--card);border-radius:12px;padding:10px 11px;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:pointer;border:1px solid transparent;user-select:none}
.task:hover{border-color:var(--line)}
.task[draggable=true]{cursor:grab}
.task.dragging{opacity:.35}
.task.isdone .ttl{text-decoration:line-through;color:var(--mut)}
.tt{display:flex;gap:8px;align-items:flex-start}
.pr{width:4px;align-self:stretch;border-radius:3px;flex:none;min-height:16px}
.ttl{flex:1;font-weight:500}
.dots{border:0;background:transparent;padding:0 6px;border-radius:6px;color:var(--mut);font-size:16px;line-height:1.2}
.dots:hover{background:var(--soft)}
.tm{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:11.5px;color:var(--mut);flex-wrap:wrap}
.chip{background:var(--soft);border-radius:6px;padding:1px 6px;font-weight:600;font-size:11px}
.due.late{color:var(--red);font-weight:600}
.due.soon{color:#c46a00;font-weight:600}
.task.warn{border-color:#ffb340;box-shadow:0 0 0 1px #ffb340}
.banner.due{background:#fff4e5;color:#7a4500;flex-wrap:wrap}
.banner.due a{color:inherit;font-weight:600}
@media (prefers-color-scheme:dark){.banner.due{background:#3a2a10;color:#ffcf8a}}
.duel{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.duel:last-child{border-bottom:0}
.mailbtn{position:relative;width:34px;height:32px;padding:0;border-radius:10px;font-size:15px}
.badge{position:absolute;top:-5px;right:-6px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 5px;min-width:16px;text-align:center;border:2px solid var(--bg)}
.tabbadge{background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:0 6px;margin-left:5px}
.inbox{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
@media (max-width:820px){.inbox{grid-template-columns:1fr}}
.ilist{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:10px;max-height:calc(100vh - 170px);overflow:auto}
.ci{display:flex;gap:10px;align-items:center;padding:9px 8px;border-radius:10px;cursor:pointer}
.ci:hover{background:var(--soft)}.ci.on{background:rgba(0,113,227,.1)}
.ci .t{flex:1;min-width:0}.ci .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .t span{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ub{background:var(--acc);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px}
.tpane{background:var(--card);border-radius:16px;box-shadow:var(--sh);display:flex;flex-direction:column;height:calc(100vh - 170px);min-height:420px}
.thead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.thread{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:72%;padding:8px 12px;border-radius:16px;background:var(--soft);white-space:pre-wrap;word-wrap:break-word;align-self:flex-start}
.bub.me{background:var(--acc);color:#fff;align-self:flex-end}
.bub .tm2{display:block;font-size:10px;opacity:.65;margin-top:3px}
.dsep{align-self:center;font-size:11px;color:var(--mut);margin:6px 0}
.tcomp{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);align-items:flex-end}
.tcomp textarea{resize:none;max-height:140px}
.pchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pchip{font-size:11px;border-radius:8px;padding:1px 7px;background:var(--soft);color:var(--mut)}
.post{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:16px 18px;margin-bottom:14px}
.post.pin{box-shadow:0 0 0 2px #ff9500,var(--sh)}
.ph2{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.cat{font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;color:#fff}
.pbody{white-space:pre-wrap;word-wrap:break-word;margin:6px 0 10px}
.replies{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;display:flex;flex-direction:column;gap:8px}
.reply{display:flex;gap:8px}.reply .rb{background:var(--soft);border-radius:12px;padding:7px 11px;flex:1;white-space:pre-wrap;word-wrap:break-word}
.dtag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;color:#fff;white-space:nowrap}
.ph{height:44px;border:2px dashed var(--acc);border-radius:12px;opacity:.55;flex:none}
.menu{position:fixed;z-index:80;background:var(--card);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:6px;min-width:220px;max-height:70vh;overflow-y:auto;border:1px solid var(--line)}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 10px;border-radius:7px}
.menu button:hover{background:var(--acc);color:#fff}
.msep{font-size:11px;color:var(--mut);padding:8px 10px 3px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.hbw{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}
@media (max-width:860px){.hbw{grid-template-columns:1fr}}
.hbnav{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:8px;position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto}
.hbnav button{display:flex;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:7px 9px;border-radius:9px;align-items:center;font-size:13px}
.hbnav button.on{background:var(--acc);color:#fff}
.hbnav .fill{margin-left:auto;font-size:10px}
.hbc>.card{margin-bottom:16px}
.hint{margin:4px 0 16px;font-size:13px}
.form{display:flex;flex-wrap:wrap;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px;width:100%;margin-bottom:2px}
.fld>span{font-size:12px;color:var(--mut);font-weight:500}
.form .fld.half{width:calc(50% - 7px)}
@media (max-width:640px){.form .fld.half{width:100%}}
.tblwrap{overflow-x:auto;margin:0 -6px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;min-width:720px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);text-align:left;padding:6px;font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:3px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl input,.tbl select,.tbl textarea{border-color:transparent;background:transparent;padding:6px}
.tbl tr:hover input:not(:disabled),.tbl tr:hover select:not(:disabled),.tbl tr:hover textarea:not(:disabled){border-color:var(--line)}
.tbl textarea{resize:none;overflow:hidden;min-height:34px}
.tbl td.x{width:34px}
.tbl tfoot td{font-weight:600;padding:8px 6px}
.blkh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.score{display:inline-grid;place-items:center;min-width:32px;height:26px;border-radius:8px;font-weight:700;color:#fff;margin-top:4px}
.ampsel{display:flex;gap:5px;padding:7px 4px}
.ampsel button{width:18px;height:18px;border-radius:50%;padding:0;border:2px solid transparent;opacity:.25}
.ampsel button.on{opacity:1;border-color:var(--ink)}
.org{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:8px}
.orgc{background:var(--soft);border-radius:12px;padding:12px}
.orgc p{margin:4px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{display:inline-flex;align-items:center;gap:5px;background:var(--card);border-radius:20px;padding:2px 9px 2px 2px;font-size:12px}
.gantt{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:12px 0;overflow-x:auto}
.ginner{min-width:900px}
.grow{display:grid;grid-template-columns:270px 1fr;align-items:center;min-height:32px}
.grow:hover{background:var(--soft)}
.glab{padding:4px 12px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtrack{position:relative;height:32px;border-left:1px solid var(--line)}
.gbar{position:absolute;top:8px;height:16px;border-radius:6px;min-width:4px}
.gms{position:absolute;top:9px;width:14px;height:14px;transform:translateX(-7px) rotate(45deg);border-radius:3px}
.gtl{position:absolute;top:0;bottom:0;width:2px;background:var(--red);opacity:.6}
.ghead{display:grid;grid-template-columns:270px 1fr;border-bottom:1px solid var(--line);margin-bottom:4px}
.gmon{position:relative;height:26px}
.gmon span{position:absolute;top:4px;font-size:11px;color:var(--mut);padding-left:5px;border-left:1px solid var(--line);white-space:nowrap}
.gsec{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:600;padding:12px 12px 4px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.mtbl{width:100%;border-collapse:collapse}
.mtbl th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-weight:600}
.mtbl td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.mtbl input,.mtbl select{padding:5px 7px}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.rolecards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:18px}
.rolec{background:var(--soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.rolec input{font-weight:600}
.swatches{display:flex;gap:8px}
.sw{width:28px;height:28px;border-radius:50%;padding:0;border:3px solid transparent}
.sw.on{border-color:var(--ink)}
#overlay .ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;overflow-y:auto;backdrop-filter:blur(3px)}
.modal{background:var(--card);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.25);width:100%;max-width:520px;padding:22px;animation:pop .18s ease}
.modal.wide{max-width:880px}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal .fld{margin-bottom:12px}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.mh h3{flex:1;font-size:18px}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.ttlin{font-size:18px;font-weight:600;border-color:transparent}
.tgrid{display:grid;grid-template-columns:1fr 240px;gap:20px}
@media (max-width:700px){.tgrid{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:2px}
.cl{display:flex;gap:8px;align-items:center;padding:3px 0}
.cl span{flex:1}
.strike{text-decoration:line-through;color:var(--mut)}
.cms{display:flex;flex-direction:column;gap:10px;margin-bottom:8px;max-height:240px;overflow:auto}
.cm{display:flex;gap:8px}
.hits button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;margin-bottom:4px}
.copybox{width:100%;min-height:220px;font-family:ui-monospace,Menlo,monospace;font-size:12px}

async function hashPw(pw,salt){
 if(!(window.crypto&&crypto.subtle))throw new Error('Kryptografie in diesem Browser nicht verfügbar');
 const enc=new TextEncoder();const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
 const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:150000,hash:'SHA-256'},key,256);
 return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function genPw(){const c='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';const r=new Uint32Array(10);crypto.getRandomValues(r);return [...r].map(x=>c[x%c.length]).join('').replace(/^(.{5})/,'$1-');}

const Store={pending:{},inflight:{},timers:{},
 busy(p){return !!(this.pending[p]||this.inflight[p]);},
 set(path,data){if(S.mode==='local')return saveLocal();this.pending[path]={mode:'set',data:clone(data)};this.kick(path,250);},
 patch(path,patch){if(S.mode==='local')return saveLocal();const c=this.pending[path];if(c&&c.mode!=='delete')deepMerge(c.data,clone(patch));else this.pending[path]={mode:'update',data:clone(patch)};this.kick(path,600);},
 del(path){if(S.mode==='local')return saveLocal();this.pending[path]={mode:'delete'};this.kick(path,0);},
 kick(path,ms){clearTimeout(this.timers[path]);this.timers[path]=setTimeout(()=>this.flush(path),ms);},
 async flush(path){
  if(this.inflight[path]||!this.pending[path])return;
  if(S.mode==='supa'&&this.pending[path].mode==='set'&&path.startsWith('tasks/')){const t=S.tasks[path.slice(6)];if(t&&this.busy('projects/'+t.pid)){this.kick(path,400);return;}}
  const job=this.pending[path];delete this.pending[path];this.inflight[path]=true;
  const ref=S.mode==='db'?S.db.doc(path):null;
  try{await this.run(ref,job,path);}
  catch(e){if(e&&e.code==='unavailable'){await sleep(700+Math.random()*900);try{await this.run(ref,job,path)}catch(e2){this.fail(e2)}}else this.fail(e);}

async function supaRun(path,job){
 const [c,id]=path.split('/');const tb=S.sb.from(SB_TABLE[c]);let r;
 if(c==='messages'||c==='posts'){const o=S[c][id];
  if(job.mode==='delete')r=await tb.delete().eq('id',id);
  else if(!o)return;
  else if(job.mode==='set')r=await tb.insert(c==='messages'?{id,sender:o.from,recipient:o.to,body:o.body,created_at:o.ts}:{id,project_id:o.pid,author:o.author,parent_id:o.parent||null,category:o.cat,title:o.title||'',body:o.body,pinned:!!o.pinned,created_at:o.ts});
  else if(c==='messages')r=await S.sb.rpc('cockpit_mark_read',{ids:[id]});
  else{r=await tb.update({pinned:!!o.pinned,title:o.title||'',body:o.body}).eq('id',id).select('id');if(!r.error&&Array.isArray(r.data)&&!r.data.length)throw {message:'Keine Berechtigung'};}
  if(r&&r.error)throw r.error;return;}
 if(job.mode==='delete'){
  if(c==='accounts')r=await S.sb.rpc('cockpit_admin_delete_user',{target:id});
  else r=await tb.delete().eq('id',id);
 }else{
  const o=S[c][id];if(!o)return;
  if(c==='accounts')r=await tb.update({name:o.name,email:o.email||'',is_admin:!!o.isAdmin,can_create:!!(o.canCreate||o.isAdmin),active:o.active!==false}).eq('id',id).select('id');
  else{
   const row=c==='projects'?{data:o}:{project_id:o.pid,data:o};
   if(job.mode==='set'){row.id=id;if(c==='projects')row.created_by=o.createdBy;r=await tb.insert(row);}
   else{row.updated_at=new Date().toISOString();r=await tb.update(row).eq('id',id).select('id');}
  }
  if(r&&!r.error&&Array.isArray(r.data)&&!r.data.length)throw {message:'Keine Berechtigung'};
 }
 if(r&&r.error)throw r.error;
}

 if(!S.account&&(S.mode==='supa'?S.needsSetup:!Object.keys(S.accounts).length)){app.innerHTML=topbar()+banners()+setupView()+credit;return focusFirst();}

/* ----- Übersicht ----- */
function ring(pct,color){const r=26,c=2*Math.PI*r;return `<svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--soft)" stroke-width="7"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c*pct/100} ${c}" transform="rotate(-90 32 32)"/></svg>`;}
function overviewView(p){
 const ts=tasksOf(p),done=ts.filter(t=>t.status==='done').length,over=ts.filter(isOver).length,pct=ts.length?Math.round(done/ts.length*100):0;

 const ms=(p.hb.meilensteine||[]).filter(r=>r.plan).sort((a,b)=>a.plan.localeCompare(b.plan));
 const nextMs=ms.filter(r=>r.status!=='erreicht').slice(0,4);

 const m=me(p);
 let h=`<div class="kpis"><div class="kpi ring">${ring(pct,p.color||'#0071e3')}<div><div class="v">${pct}%</div><div class="l">Fortschritt (Aufgaben)</div></div></div>

 ${can(p,'budget_sehen')?`<div class="kpi"><div class="v">${eur(ist)}</div><div class="l">Ist-Kosten von ${eur(bud)} Budget</div><div class="bar" style="margin-top:8px"><div style="width:${bud?Math.min(100,ist/bud*100):0}%;background:${ist>bud?'var(--red)':'var(--grn)'}"></div></div></div>`:''}
 <div class="kpi"><div class="v" style="color:${risks.filter(r=>r.sc>=15).length?'var(--red)':'inherit'}">${risks.filter(r=>r.sc>=15).length}</div><div class="l">kritische Risiken (Score ≥ 15)</div></div></div>`;

 {const ann=Object.values(S.posts).filter(x=>x.pid===p.id&&!x.parent).sort((a,b)=>(b.pinned-a.pinned)||String(b.ts).localeCompare(String(a.ts))).filter(x=>x.cat==='ankuendigung'||x.pinned).slice(0,3);

/* ----- Projekthandbuch ----- */
function secVisible(p,s){return !s.perm||can(p,s.perm);}
function secFilled(p,s){return s.blocks.some(b=>b.kind==='form'?Object.values(p.hb[b.key]||{}).some(v=>v!==''&&v!=null):(p.hb[b.key]||[]).length>0);}
function hbView(p){
 const secs=SECTIONS.filter(s=>secVisible(p,s));
 const cur=secs.find(s=>s.key===S.hbSec)||secs[0];
 const ro=!can(p,'handbuch_bearbeiten');
 const filled=secs.filter(s=>secFilled(p,s)).length;
 let nav=`<div class="hbnav"><div class="sm mut" style="padding:6px 9px 8px">Projekthandbuch · ${filled}/${secs.length} Kapitel befüllt</div>${secs.map((s,i)=>`<button class="${s===cur?'on':''}" data-act="hbSec" data-id="${s.key}"><span>${s.icon}</span><span>${i+1}. ${esc(s.title)}</span><span class="fill">${secFilled(p,s)?'●':'○'}</span></button>`).join('')}<div style="padding:8px 4px 2px"><button class="sm" style="width:100%" data-act="copyHb">📋 Handbuch als Text kopieren</button></div></div>`;
 let c=`<div class="hbc"><div class="row" style="align-items:flex-start"><div style="flex:1"><h2>${cur.icon} ${esc(cur.title)}</h2><p class="hint mut">${esc(cur.hint||'')}${ro?' <b>· Nur-Lesen (fehlendes Recht „Projekthandbuch bearbeiten“)</b>':''}</p></div></div>`;
 if(cur.special==='org')c+=`<div class="card">${orgChart(p)}</div>`;
 cur.blocks.forEach(b=>{c+=b.kind==='form'?formBlock(p,b,ro):tableBlock(p,b,ro);});
 return `<div class="hbw">${nav}${c}</div></div>`;
}
function input(t,val,attrs,ro,p,o){
 const d=ro?'disabled':'';val=val??'';
 switch(t){
  case 'textarea':return `<textarea ${attrs} ${d} rows="${attrs.includes('data-cell')?1:3}">${esc(val)}</textarea>`;
  case 'date':return `<input type="date" ${attrs} ${d} value="${esc(val)}">`;
  case 'number':return `<input type="number" step="any" ${attrs} ${d} value="${esc(val)}">`;
  case 'select':return `<select ${attrs} ${d}><option value=""></option>${o.map(x=>`<option ${String(x)===String(val)?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
  case 'member':return `<select ${attrs} ${d}><option value="">–</option>${p.members.map(m=>`<option value="${esc(m.id)}" ${m.id===val?'selected':''}>${esc(mName(p,m))}</option>`).join('')}</select>`;
  case 'check':return `<input type="checkbox" ${attrs} ${d} ${val?'checked':''} style="margin:9px 6px">`;
  case 'ampel':return `<div class="ampsel">${Object.keys(AMPEL).map(k=>`<button ${attrs} data-act="ampel" data-v="${k}" class="${val===k?'on':''}" style="background:${AMPEL[k]}" title="${k}" ${d}></button>`).join('')}</div>`;
  default:return `<input type="text" ${attrs} ${d} value="${esc(val)}">`;
 }
}
function formBlock(p,b,ro){
 const o=p.hb[b.key]||{};
 return `<div class="card"><div class="form">${b.fields.filter(f=>!f.perm||can(p,f.perm)).map(f=>`<label class="fld ${f.half?'half':''}"><span>${esc(f.l)}</span>${input(f.t,o[f.k],`data-f="hb.${b.key}.${f.k}"`,ro,p,f.o)}</label>`).join('')}</div></div>`;

function tableBlock(p,b,ro){
 let rows=(p.hb[b.key]||[]).slice();
 if(b.sortBy==='code')rows.sort(byCode);else if(b.sortBy)rows.sort((x,y)=>String(x[b.sortBy]||'9999').localeCompare(String(y[b.sortBy]||'9999')));
 const extraH=b.key==='psp'?'<th style="width:110px">Aufgaben</th>':b.key==='risiken'?'<th style="width:60px">Score</th>':'';
 let h=`<div class="card"><div class="blkh"><h3 style="flex:1">${esc(b.title||'')}</h3><span class="sm mut">${rows.length} Einträge</span></div><div class="tblwrap"><table class="tbl"><thead><tr>${b.cols.map(c=>`<th style="${c.w?'width:'+c.w+'px':''}">${esc(c.l)}</th>`).join('')}${extraH}${ro?'':'<th></th>'}</tr></thead><tbody>`;
 h+=rows.map(r=>`<tr>${b.cols.map(c=>`<td${b.key==='psp'&&c.k==='name'?` style="padding-left:${4+depth(r.code)*20}px"`:''}>${input(c.t,r[c.k],`data-cell="${b.key}|${esc(r.id)}|${c.k}"`,ro,p,c.o)}</td>`).join('')}${extraTd(p,b,r)}${ro?'':`<td class="x"><button class="ghost sm" data-act="rowDel" data-id="${b.key}|${esc(r.id)}" title="Zeile löschen">✕</button></td>`}</tr>`).join('');
 if(!rows.length)h+=`<tr><td colspan="${b.cols.length+2}" class="sm mut" style="padding:14px 6px">Noch keine Einträge.</td></tr>`;
 h+='</tbody>';
 if(b.sum&&rows.length){const pl=sum(rows,'plan'),is=sum(rows,'ist'),bud=+((p.hb.auftrag||{}).budget)||0;h+=`<tfoot><tr><td colspan="3">Summe${bud?` · Budget ${eur(bud)} · Rest ${eur(bud-is)}`:''}</td><td>${eur(pl)}</td><td style="color:${is>pl?'var(--red)':'inherit'}">${eur(is)}</td><td></td></tr></tfoot>`;}
 h+=`</table></div>${ro?'':`<div style="margin-top:10px"><button class="sm" data-act="rowAdd" data-id="${b.key}">+ ${esc(b.add||'Zeile hinzufügen')}</button></div>`}</div>`;
 return h;
}
function extraTd(p,b,r){
 if(b.key==='psp'){const ts=tasksOf(p).filter(t=>t.apId===r.id),d=ts.filter(t=>t.status==='done').length;return `<td><div class="row" style="padding:6px 2px;gap:4px;flex-wrap:nowrap"><span class="sm mut">${ts.length?`${d}/${ts.length}`:'–'}</span>${can(p,'aufgaben_erstellen')?`<button class="ghost sm" data-act="apTask" data-id="${esc(r.id)}" title="Aufgabe zu diesem Arbeitspaket anlegen">＋</button>`:''}</div></td>`;}
 if(b.key==='risiken'){const sc=(+r.w||0)*(+r.a||0);return `<td><span class="score" data-score="${esc(r.id)}" style="background:${scoreColor(sc)}">${sc||'–'}</span></td>`;}
 return '';

function orgChart(p){
 return `<h3 style="margin-bottom:10px">Projektrollen & Besetzung</h3><div class="org">${p.roles.map(r=>{const ms=p.members.filter(m=>m.roleId===r.id);return `<div class="orgc"><b>${esc(r.name)}</b><p class="sm mut">${esc(r.desc||'')}</p><div class="chips">${ms.map(m=>`<span class="mchip">${av(p,m,'sm')} ${esc(mName(p,m))}</span>`).join('')||'<span class="sm mut">nicht besetzt</span>'}</div></div>`}).join('')}</div><p class="sm mut" style="margin:0">Rollen, Rechte und Personen pflegst du unter <a href="#" data-act="tab" data-id="team">Team & Rollen</a>.</p>`;
}
function hbMarkdown(p){
 const val=(t,v)=>t==='member'?mName(p,p.members.find(m=>m.id===v)):t==='check'?(v?'✓':''):t==='date'?fmtD(v):(v??'');
 let s=`# Projekthandbuch: ${p.name}\n${p.desc||''}\nStand: ${fmtD(today())}\n`;
 SECTIONS.filter(x=>secVisible(p,x)).forEach((sec,i)=>{
  s+=`\n## ${i+1}. ${sec.title}\n`;
  if(sec.special==='org')p.roles.forEach(r=>{s+=`- **${r.name}:** ${p.members.filter(m=>m.roleId===r.id).map(m=>mName(p,m)).join(', ')||'–'}\n`;});
  sec.blocks.forEach(b=>{
   if(b.kind==='form'){const o=p.hb[b.key]||{};b.fields.filter(f=>!f.perm||can(p,f.perm)).forEach(f=>{s+=`**${f.l}:** ${String(val(f.t,o[f.k])).replace(/\n/g,' ')||'–'}\n\n`;});}
   else{const rows=p.hb[b.key]||[];s+=`\n### ${b.title}\n`;if(!rows.length){s+='–\n';return;}s+=`| ${b.cols.map(c=>c.l).join(' | ')} |\n|${b.cols.map(()=>'---').join('|')}|\n`;rows.forEach(r=>{s+=`| ${b.cols.map(c=>String(val(c.t,r[c.k])).replace(/\n/g,' ').replace(/\|/g,'/')).join(' | ')} |\n`;});}
  });
 });
 return s+`\n— erstellt mit dem Projekt-Cockpit von Luca Kofler`;
}

/* ----- Terminplan (Gantt) ----- */
function ganttView(p){
 const ps=(p.hb.psp||[]).filter(r=>r.start&&r.ende).sort(byCode),ms=(p.hb.meilensteine||[]).filter(r=>r.plan).sort((a,b)=>a.plan.localeCompare(b.plan));
 const withDue=S.ganttTasks?tasksOf(p).filter(t=>t.due).sort((a,b)=>a.due.localeCompare(b.due)):[];
 if(!ps.length&&!ms.length)return `<div class="empty"><div class="ei">📅</div><h3>Noch kein Terminplan</h3><p class="mut">Der Terminplan entsteht automatisch aus den Arbeitspaketen (mit Start & Ende) und den Meilensteinen im Projekthandbuch.</p><div class="row c"><button class="pri" data-act="goHb" data-id="psp">Arbeitspakete planen</button><button data-act="goHb" data-id="meilensteine">Meilensteine planen</button></div></div>`;
 const ds=[...ps.flatMap(r=>[toT(r.start),toT(r.ende)]),...ms.map(r=>toT(r.plan)),...withDue.map(t=>toT(t.due))];
 const min=Math.min(...ds)-3*864e5,max=Math.max(...ds)+5*864e5,span=max-min,X=t=>(t-min)/span*100;
 let mon='';const d=new Date(min);d.setDate(1);d.setMonth(d.getMonth()+1);
 mon+=`<span style="left:0">${new Date(min).toLocaleDateString('de-AT',{month:'short',year:'2-digit'})}</span>`;
 while(d.getTime()<max){mon+=`<span style="left:${X(d.getTime())}%">${d.toLocaleDateString('de-AT',{month:'short',year:'2-digit'})}</span>`;d.setMonth(d.getMonth()+1);}
 const tl=Date.now()>min&&Date.now()<max?`<div class="gtl" style="left:${X(Date.now())}%" title="Heute"></div>`:'';
 const col=r=>r.status==='erledigt'?'#34c759':r.status==='in Arbeit'?(p.color||'#0071e3'):'#aeaeb2';

 if(ps.length){h+=`<div class="gsec">Arbeitspakete</div>`;ps.forEach(r=>{const w=r.verantw?p.members.find(m=>m.id===r.verantw):null;const parent=(p.hb.psp||[]).some(x=>x.code&&r.code&&String(x.code).startsWith(String(r.code)+'.'));h+=`<div class="grow"><div class="glab" style="padding-left:${12+depth(r.code)*16}px;${parent?'font-weight:600':''}">${esc(r.code||'')} ${esc(r.name||'')}${w?` <span class="sm mut">· ${esc(firstName(mName(p,w)))}</span>`:''}</div><div class="gtrack">${tl}<div class="gbar" style="left:${X(toT(r.start))}%;width:${Math.max(X(toT(r.ende)+864e5)-X(toT(r.start)),.5)}%;background:${col(r)};${parent?'height:10px;top:11px;opacity:.75':''}" title="${esc(r.name)}: ${fmtD(r.start)} – ${fmtD(r.ende)}"></div></div></div>`;});}
 if(withDue.length){h+=`<div class="gsec">Aufgaben (Fälligkeit)</div>`;withDue.forEach(t=>{h+=`<div class="grow" data-act="openTask" data-id="${esc(t.id)}" style="cursor:pointer"><div class="glab">${esc(t.title)}</div><div class="gtrack">${tl}<div class="gms" style="left:${X(toT(t.due)+432e5)}%;background:${t.status==='done'?'#34c759':isOver(t)?'#ff3b30':'#8e8e93'};border-radius:50%;transform:translateX(-7px)"></div></div></div>`;});}

function assignRows(preset){
 const ps=Object.values(S.projects).map(ensure).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
 if(!ps.length)return '<p class="sm mut">Noch keine Projekte vorhanden.</p>';
 return `<div class="asgn">${ps.map(p=>{const cur=preset&&preset[p.id];return `<div class="row"><input type="checkbox" data-asp="${esc(p.id)}" ${cur?'checked':''}><span style="flex:1">${esc(p.name)}</span><select data-asr="${esc(p.id)}">${p.roles.map(r=>`<option value="${esc(r.id)}" ${(cur?cur===r.id:r.id==='r_tm')?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div>`}).join('')}</div>`;
}
function readAssign(){const out={};document.querySelectorAll('#overlay [data-asp]').forEach(c=>{if(c.checked){const s=document.querySelector(`#overlay [data-asr="${c.dataset.asp}"]`);out[c.dataset.asp]=s?s.value:'r_tm';}});return out;}
function applyAssign(acc,map){
 Object.values(S.projects).map(ensure).forEach(p=>{
  const ex=p.members.find(m=>m.accountId===acc.id);const want=map[p.id];
  if(want&&!ex){savePatch(p,{members:[...p.members,{id:'m_'+uid(),name:acc.name,email:acc.email||'',roleId:want,accountId:acc.id,status:'aktiv'}]});}
  else if(want&&ex&&ex.roleId!==want){const ms=clone(p.members);ms.find(m=>m.id===ex.id).roleId=want;savePatch(p,{members:ms});}
  else if(!want&&ex){if(p.createdBy===acc.id&&!acc.isAdmin)return;const ms=p.members.filter(m=>m.id!==ex.id);savePatch(p,{members:ms});tasksOf(p).filter(t=>t.assignee===ex.id).forEach(t=>updTask(t,{assignee:''}));}
 });
}

function openMenu(btn,items){
 closeMenu();const r=btn.getBoundingClientRect();const m=document.createElement('div');m.className='menu';
 m.innerHTML=items.map((i,ix)=>i.sep!==undefined?`<div class="msep">${esc(i.sep)}</div>`:`<button data-mi="${ix}" ${i.dis?'disabled':''}>${i.on?'✓ ':'&nbsp;&nbsp;&nbsp;'}${esc(i.l)}</button>`).join('');
 document.body.appendChild(m);
 const mw=m.offsetWidth,mh=m.offsetHeight;let left=Math.min(r.left,innerWidth-mw-10),top=r.bottom+4;if(top+mh>innerHeight-10)top=Math.max(10,r.top-mh-4);
 m.style.left=Math.max(10,left)+'px';m.style.top=top+'px';
 m.addEventListener('click',e=>{const b=e.target.closest('[data-mi]');if(!b||b.disabled)return;const it=items[+b.dataset.mi];closeMenu();it.fn();});
 S.menu=m;
}
async function copyText(txt){
 try{await navigator.clipboard.writeText(txt);toast('In die Zwischenablage kopiert ✓');}
 catch(e){modal(`<div class="mh"><h3>Zum Kopieren markieren</h3><button class="ghost" data-act="closeModal">✕</button></div><textarea class="copybox" readonly>${esc(txt)}</textarea><p class="sm mut">Text ist markiert – mit ⌘C / Strg+C kopieren.</p>`);setTimeout(()=>{const t=$('.copybox');if(t){t.focus();t.select();}},60);}
}

function taskMenu(btn,id){
 const p=P(),t=S.tasks[id];if(!t)return;const ed=canEditTask(p,t),z=can(p,'aufgaben_zuweisen');
 const items=[{sep:'Status'}];
 STATUSES.forEach(s=>items.push({l:s.l,on:t.status===s.k,dis:!ed,fn:()=>{setStatus(t,s.k);}}));
 items.push({sep:'Zuweisen an'});items.push({l:'– niemand –',on:!t.assignee,dis:!z,fn:()=>{updTask(t,{assignee:''});refresh();}});
 p.members.forEach(m=>items.push({l:mName(p,m),on:t.assignee===m.id,dis:!z,fn:()=>{updTask(t,{assignee:m.id});toast('Zugewiesen an '+mName(p,m));refresh();}}));
 items.push({sep:'Priorität'});PRIOS.forEach(x=>items.push({l:x.l,on:t.prio===x.k,dis:!ed,fn:()=>{updTask(t,{prio:x.k});refresh();}}));
 items.push({sep:'Aktionen'});
 if(!$('#overlay .modal'))items.push({l:'Öffnen / Details',fn:()=>taskModal(t.id)});
 if(can(p,'aufgaben_erstellen'))items.push({l:'Duplizieren',fn:()=>{const pre=clone(t);delete pre.id;Object.assign(pre,{title:t.title+' (Kopie)',comments:[],createdAt:today(),order:(t.order||0)+1});addTask(p,pre);refresh();toast('Aufgabe dupliziert');}});
 if(can(p,'aufgaben_loeschen'))items.push({l:'Löschen',fn:()=>delTask(t.id)});
 openMenu(btn,items);
}
function setStatus(t,k){const patch={status:k};if(k==='done'&&t.status!=='done')patch.doneAt=today();updTask(t,patch);refresh();}
function refresh(){render();if(S.modalTask&&S.tasks[S.modalTask])taskModal(S.modalTask);}
function delTask(id){const t=S.tasks[id];if(!t)return;confirmBox(`Aufgabe „${t.title}“ löschen?`,()=>{delete S.tasks[id];Store.del('tasks/'+id);S.modalTask=null;render();toast('Aufgabe gelöscht');});}
function helpModal(){
 modal(`<div class="mh"><h3>❓ So funktioniert dein Projekt-Cockpit</h3><button class="ghost" data-act="closeModal">✕</button></div><div class="helpc">
 <h4>🗂️ Projekte</h4><p>Auf der Startseite legst du beliebig viele Projekte an („+ Neues Projekt“). Mit „✨ Beispielprojekt“ bekommst du ein komplett befülltes Projekt zum Ausprobieren. „Meine offenen Aufgaben“ zeigt alles, was dir projektübergreifend zugewiesen ist.</p>
 <h4>📊 Übersicht</h4><p>Fortschritt, überfällige Aufgaben, Arbeitspakete, Budget, kritische Risiken, Ampelstatus, nächste Meilensteine und Auslastung im Team – alles auf einen Blick.</p>
 <h4>✅ Aufgaben – zuweisen per Drag & Drop oder Menü</h4><ul>
 <li><b>Nach Status:</b> Karten zwischen „Offen → In Arbeit → Review → Erledigt“ ziehen. Innerhalb einer Spalte sortierst du per Ziehen.</li>
 <li><b>Zuweisen per Drag & Drop:</b> Karte auf eine Person in der Team-Leiste über dem Board ziehen – oder in der Ansicht „Nach Person“ von einer Spalte in die andere.</li>
 <li><b>Zuweisen per Menü:</b> „⋯“ auf jeder Karte → Status, Person, Priorität, Duplizieren, Löschen. In der „Liste“ geht alles über Auswahlfelder.</li>
 <li>Karte anklicken → Details: Beschreibung, Checkliste, Kommentare, Fälligkeit, Verknüpfung zum Arbeitspaket.</li>
 <li>„＋“ in einer Spalte legt die Aufgabe direkt dort an (Titel + Enter).</li>
 <li><b>📦 Arbeitspakete:</b> Mit „📦 + Arbeitspaket“ (oder in der Aufgabe unter „Arbeitspaket → ＋ Neues Arbeitspaket“) anlegen. In der Ansicht „Nach Arbeitspaket“ ziehst du Aufgaben per Drag & Drop in ein Paket. Arbeitspakete landen automatisch im Projektstrukturplan und im Terminplan.</li>
 <li><b>⚠️ Fälligkeits-Warnung:</b> Ist eine dir zugewiesene Aufgabe heute oder morgen fällig (oder überfällig), siehst du oben eine Warnleiste, die Karte ist orange markiert und beim ersten Öffnen am Tag erscheint ein Hinweisfenster. Optional gibt es Browser-Benachrichtigungen (🔔).</li></ul>
 <h4>✉️ Postfach</h4><p>Über ✉️ oben rechts öffnest du dein Postfach. Unter „Kontakte“ siehst du alle Personen, mit denen du Projekte teilst – inklusive der Projekte und Rollen – und kannst ihnen direkt schreiben. Auch im Team eines Projekts und im Forum gibt es ✉️ zum privaten Schreiben. Neue Nachrichten zeigt ein roter Zähler. Admins können allen Benutzern schreiben.</p>
 <h4>💬 Projekt-Forum</h4><p>Jedes Projekt hat ein Forum mit Ankündigungen, Diskussionen, Fragen und Infos. Beiträge können beantwortet werden. Ankündigungen schreiben, Beiträge anheften und fremde Beiträge löschen dürfen nur Personen mit dem Recht „Projekt-Stammdaten bearbeiten“; posten darf, wer „Kommentieren“ darf. Neue Beiträge zeigt ein Zähler am Forum-Tab, Ankündigungen erscheinen auch in der Übersicht.</p>
 <h4>📘 Projekthandbuch</h4><p>Alle Kapitel eines klassischen Projekthandbuchs (angelehnt an pma): Projektauftrag & Ziele, Abgrenzung & Kontext, Stakeholder, Projektorganisation, Projektstrukturplan, Meilensteine, Kosten, Risiken (mit automatischem Score), Kommunikation, Projektmarketing, Spielregeln, Protokolle/To-dos, Statusberichte mit Ampeln, Änderungsmanagement und Projektabschluss inkl. Lessons Learned. Alles wird automatisch gespeichert. ● = Kapitel befüllt. „📋 Als Text kopieren“ exportiert das ganze Handbuch (z. B. für Word).</p>
 <h4>📅 Terminplan</h4><p>Das Gantt-Diagramm entsteht automatisch aus den Arbeitspaketen (Start/Ende) und Meilensteinen. Optional mit Aufgaben-Fälligkeiten.</p>
 <ul><li><b>Person zuteilen:</b> Unter „Team & Rollen“ Benutzer aus der Benutzerverwaltung dem Projekt mit einer Rolle zuteilen – oder Platzhalter ohne Login (z. B. Externe) anlegen.</li>
 <li><b>Rollen & Rechte:</b> 5 Standardrollen (Projektleitung, Auftraggeber:in, Teammitglied, Mitarbeiter:in, Gast). Rollen umbenennen, neue anlegen und in der Matrix 12 Rechte frei vergeben.</li>
 <li><b>👁 Ansicht als:</b> Oben rechts siehst du das Projekt aus Sicht einer Person – ideal, um Rechte zu prüfen.</li></ul>
 <h4>🔐 Login, Benutzer & Sichtbarkeit</h4><ul><li>Jede Person meldet sich mit <b>Benutzername & Passwort</b> an und sieht <b>nur die Projekte, denen sie zugeteilt ist</b> – mit den Rechten ihrer Rolle im jeweiligen Projekt.</li>
 <li><b>Benutzerverwaltung</b> (Admins: oben rechts auf deinen Namen oder Button auf der Startseite): Benutzer anlegen, Passwort vergeben/zurücksetzen (🔑), sperren, löschen, zum Admin machen, „Darf Projekte anlegen“ erlauben und direkt Projekten mit Rolle zuteilen.</li>
 <li>Beim Anlegen erhältst du fertige <b>Zugangsdaten zum Kopieren</b>. Jede Person kann ihr Passwort selbst ändern.</li>
 <li><b>Admins</b> sehen alles. Wer ein Projekt anlegt, hat darin alle Rechte.</li>
 <li>${S.mode==='db'?'Damit sich andere einloggen können, teile das Cockpit auf claude.ai (mind. „Mitwirkende:r“). Als Eigentümer:in hast du zusätzlich einen Notfallzugang auf der Login-Seite.':S.mode==='supa'?'Alle Daten liegen in einer gemeinsamen Online-Datenbank (Supabase). Niemand kann sich selbst registrieren – Konten legen nur Admins an. Welche Projekte jemand sieht, prüft die Datenbank selbst.':'Aktuell im lokalen Modus: Daten liegen nur in diesem Browser.'}</li></ul>
 <p class="sm mut">Hinweis zur Sicherheit: Passwörter werden nur als Hash gespeichert. Login und Sichtbarkeit werden in der Oberfläche durchgesetzt – für eine öffentliche Website mit sensiblen Daten sollte das Login zusätzlich serverseitig abgesichert werden (z. B. Supabase oder Firebase).</p>
 <h4>🌐 Später als Website</h4><p>Unter Einstellungen exportierst du jedes Projekt als JSON und importierst es auf der Startseite wieder – so lassen sich die Daten in eine eigene Website übernehmen.</p>
 <p class="sm mut" style="margin-top:18px">Cockpit von Luca Kofler</p></div>`,'wide');
}

  if(!name||!u)return err.textContent='Bitte Name und Benutzername angeben.';if(pw.length<8)return err.textContent='Das Passwort braucht mind. 8 Zeichen.';if(pw!==pw2)return err.textContent='Die Passwörter stimmen nicht überein.';

 async doLogin(){const err=$('#lerr');if(Date.now()<loginLock)return err.textContent='Zu viele Versuche – bitte kurz warten.';

function onInput(e){
 const el=e.target,p=P(),ds=el.dataset||{};
 if(ds.draft!==undefined){S.drafts[ds.draft]=el.value;return;}
 if(ds.flt!==undefined){S.filter[ds.flt]=el.value;const w=$('#boardWrap');if(w&&p)w.innerHTML=boardHtml(p);return;}
 if(ds.f||ds.cell){if(el.tagName==='TEXTAREA')autoGrow(el);applyBinding(el,el.type==='checkbox'?el.checked:el.type==='number'?(el.value===''?'':+el.value):el.value,e.type);return;}

 if(ds.chg==='ganttTasks'&&e.type==='change'){S.ganttTasks=el.checked;render();return;}
 if(ds.af){if(!isAdmin())return;const [id,k]=ds.af.split('|');const a=S.accounts[id];if(!a)return;const v=k==='name'?el.value.trim():el.value;if(k==='name'&&!v)return;a[k]=v;Store.patch('accounts/'+id,{[k]:v});if(e.type==='change')S.dirty=true;return;}
 if(ds.afc&&e.type==='change'){if(!isAdmin())return;const [id,k]=ds.afc.split('|');const a=S.accounts[id];if(!a)return;if(k==='isAdmin'&&!el.checked&&Object.values(S.accounts).filter(x=>x.isAdmin&&x.active!==false).length<=1){el.checked=true;return toast('Es muss mindestens einen Admin geben');}
  const patch={[k]:el.checked};if(k==='isAdmin'&&el.checked)patch.canCreate=true;deepMerge(a,patch);Store.patch('accounts/'+id,patch);render();return;}
 if(ds.nuu===undefined&&el.id==='nuName'){const u=$('#nuUser');if(u&&!u.dataset.touched)u.value=userSlug(el.value);return;}
 if(el.id==='nuUser'){el.dataset.touched='1';return;}
 if(el.id==='amAcc'){const f=$('#amNameF');if(f)f.style.display=el.value?'none':'';return;}
 if(!p)return;
 if(ds.macc&&e.type==='change'){if(!can(p,'mitglieder_verwalten')||!el.value)return;const ms=clone(p.members);const m=ms.find(x=>x.id===ds.macc);if(m){m.accountId=el.value;savePatch(p,{members:ms});render();toast('Login verknüpft');}return;}
 if(ds.mf){if(!can(p,'mitglieder_verwalten'))return;const [id,k]=ds.mf.split('|');const ms=clone(p.members);const m=ms.find(x=>x.id===id);if(m){m[k]=el.value;savePatch(p,{members:ms});}if(e.type==='change')S.dirty=true;return;}
 if(ds.mrole&&e.type==='change'){if(!can(p,'mitglieder_verwalten'))return;const ms=clone(p.members);const m=ms.find(x=>x.id===ds.mrole);if(m){m.roleId=el.value;savePatch(p,{members:ms});toast('Rolle geändert');}return;}
 if(ds.rf){if(!can(p,'rollen_verwalten'))return;const [id,k]=ds.rf.split('|');const rs=clone(p.roles);const r=rs.find(x=>x.id===id);if(r){r[k]=el.value;savePatch(p,{roles:rs});}if(e.type==='change')S.dirty=true;return;}
 if(ds.perm&&e.type==='change'){if(!can(p,'rollen_verwalten'))return;const [id,k]=ds.perm.split('|');const rs=clone(p.roles);const r=rs.find(x=>x.id===id);if(r){r.perms=r.perms||{};r.perms[k]=el.checked;savePatch(p,{roles:rs});}return;}
 if(ds.sf){if(!can(p,'projekt_bearbeiten'))return;savePatch(p,{[ds.sf]:el.value});if(e.type==='change')S.dirty=true;return;}
 if(el.id==='ntAp'&&el.value==='__new'&&e.type==='change'){S.apReturn={create:{title:$('#ntTitle').value,desc:$('#ntDesc').value,assignee:$('#ntAs').value,status:$('#ntSt').value,prio:$('#ntPr').value,due:$('#ntDue').value}};apModal();return;}
 if(ds.tf==='apId'&&el.value==='__new'){if(e.type==='change'){S.apReturn={tid:S.modalTask};apModal();}return;}
 if(ds.tf){const t=S.tasks[S.modalTask];if(!t)return;const f=ds.tf;
  if(f==='assignee'?!can(p,'aufgaben_zuweisen'):!canEditTask(p,t))return;
  if(f==='status'){if(e.type==='change')setStatus(t,el.value);return;}
  updTask(t,{[f]:el.value});if(e.type==='change'&&f!=='desc'&&f!=='title')refresh();else if(e.type==='change')render();return;}
 if(ds.tq&&e.type==='change'){const [id,f]=ds.tq.split('|');const t=S.tasks[id];if(!t)return;if(f==='status')return setStatus(t,el.value);updTask(t,{[f]:el.value});render();return;}

function applyBinding(el,v,et){
 const p=P();if(!p||!can(p,'handbuch_bearbeiten'))return;
 if(el.dataset.f){const parts=el.dataset.f.split('.');const patch={};let o=patch;parts.forEach((k,i)=>{if(i===parts.length-1)o[k]=v;else o=o[k]={};});savePatch(p,patch);return;}

 if(tbl==='risiken'){const s=document.querySelector(`[data-score="${rid}"]`);if(s){const sc=(+r.w||0)*(+r.a||0);s.textContent=sc||'–';s.style.background=scoreColor(sc);}}

/* ===== Drag & Drop ===== */
let ph=null;
function clearPh(){if(ph){ph.remove();ph=null;}}
function placePh(z,y){
 if(!ph){ph=document.createElement('div');ph.className='ph';}
 const cards=[...z.querySelectorAll('.task:not(.dragging)')];
 const after=cards.find(c=>{const r=c.getBoundingClientRect();return y<r.top+r.height/2;});
 if(after){if(ph.nextSibling!==after||ph.parentNode!==z)z.insertBefore(ph,after);}else if(ph.parentNode!==z||ph.nextSibling)z.appendChild(ph);
}
function phIndex(z){if(!ph||ph.parentNode!==z)return -1;let i=0;for(const c of z.children){if(c===ph)return i;if(c.classList.contains('task')&&!c.classList.contains('dragging'))i++;}return i;}
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.task[data-tid]');if(!c)return;if(c.getAttribute('draggable')!=='true'){e.preventDefault();return;}S.drag=c.dataset.tid;closeMenu();e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',S.drag);}catch(_){}setTimeout(()=>c.classList.add('dragging'),0);});
document.addEventListener('dragend',()=>{S.drag=null;document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging'));document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));clearPh();});
document.addEventListener('dragover',e=>{if(!S.drag)return;const z=e.target.closest&&e.target.closest('[data-drop]');document.querySelectorAll('.over').forEach(x=>x!==z&&x.classList.remove('over'));if(!z){clearPh();return;}e.preventDefault();e.dataTransfer.dropEffect='move';z.classList.add('over');if(z.classList.contains('col-list'))placePh(z,e.clientY);else clearPh();});
document.addEventListener('drop',e=>{if(!S.drag)return;const z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;e.preventDefault();const idx=z.classList.contains('col-list')?phIndex(z):-1;const tid=S.drag;S.drag=null;clearPh();dropTask(tid,z.dataset.drop,z,idx);});
function dropTask(tid,target,z,idx){
 const p=P(),t=S.tasks[tid];if(!t||!p)return;
 const i=target.indexOf(':'),kind=target.slice(0,i),val=target.slice(i+1);
 const patch={};let msg='';
 if(kind==='ap'){if((val||'')!==(t.apId||'')){if(!canEditTask(p,t))return deny();patch.apId=val||'';const r=(p.hb.psp||[]).find(x=>x.id===val);msg=r?'Arbeitspaket: '+(r.code?r.code+' ':'')+r.name:'Arbeitspaket entfernt';}}
 else if(kind==='status'){if(val!==t.status){if(!canEditTask(p,t))return deny();patch.status=val;if(val==='done')patch.doneAt=today();msg='Status: '+stLabel(val);}}
 else{const nv=val||'';if(nv!==(t.assignee||'')){if(!can(p,'aufgaben_zuweisen'))return deny();patch.assignee=nv;const m=p.members.find(x=>x.id===nv);msg=m?'Zugewiesen an '+mName(p,m):'Zuweisung entfernt';}}
 if(idx>=0){
  if(!Object.keys(patch).length&&!canEditTask(p,t)&&!can(p,'aufgaben_zuweisen'))return deny();
  const ids=[...z.querySelectorAll('.task')].map(c=>c.dataset.tid).filter(x=>x!==tid);const ord=ids.map(x=>(S.tasks[x]&&S.tasks[x].order)||0);
  const b=ord[idx-1],a=ord[idx];patch.order=b==null&&a==null?Date.now():b==null?a-1000:a==null?b+1000:(a+b)/2;
 }
 if(!Object.keys(patch).length)return;
 updTask(t,patch);render();if(msg)toast(msg);
}
